# Spring Boot application properties

# Server port (optional, defaults to 8080)
# server.port=8080

# Thymeleaf configuration (optional, sensible defaults)
# spring.thymeleaf.prefix=classpath:/templates/
# spring.thymeleaf.suffix=.html
# spring.thymeleaf.cache=false # Disable cache during development

# Logging configuration (optional)
# logging.level.com.example.integration=DEBUG

# ClickHouse connection details (will be overridden by UI inputs ideally)
# clickhouse.host=
# clickhouse.port=
# clickhouse.database=
# clickhouse.user=
# clickhouse.token=

# Flat file details (will be overridden by UI inputs)
# flatfile.path=
# flatfile.delimiter=, 